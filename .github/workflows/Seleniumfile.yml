name: Selenium 테스트

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  selenium_test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium

      - name: Selenium 테스트 실행
        run: |
          pytest